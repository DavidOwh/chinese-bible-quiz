<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6b4f2a" />
  <title>一起认识圣经・轻松版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">华文圣经学习</p>
        <h1>一起认识圣经</h1>
        <p class="subtitle">轻松学习，在问答中认识上帝的话。</p>
      </div>
      <button id="seniorToggle" class="icon-btn" aria-pressed="false">长者大字模式</button>
    </header>

    <section id="homeScreen" class="screen active">
      <div class="welcome-card">
        <div>
          <span class="badge">每日学习 · 随时复习</span>
          <h2>今天要挑战哪一个程度？</h2>
          <p>每题有四个选项。作答后会显示正确答案、简单解释和经文出处。</p>
        </div>
        <div class="streak-box">
          <strong id="streakCount">0</strong>
          <span>连续学习天数</span>
        </div>
      </div>

      <div id="levelGrid" class="level-grid"></div>

      <div class="action-grid">
        <button id="dailyBtn" class="secondary-card">
          <span class="card-icon">☀</span>
          <span><strong>每日一题</strong><small>完成今天的圣经挑战</small></span>
        </button>
        <button id="reviewBtn" class="secondary-card">
          <span class="card-icon">↻</span>
          <span><strong>错题复习</strong><small id="wrongCountLabel">目前没有错题</small></span>
        </button>
        <button id="progressBtn" class="secondary-card">
          <span class="card-icon">✓</span>
          <span><strong>我的进度</strong><small>查看得分与学习情况</small></span>
        </button>
      </div>
    </section>

    <section id="quizScreen" class="screen">
      <div class="quiz-head">
        <button id="backBtn" class="text-btn">← 返回首页</button>
        <div class="quiz-meta">
          <span id="quizLevel">入门级</span>
          <span id="questionCounter">1 / 10</span>
        </div>
      </div>

      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>

      <article class="question-card">
        <div class="question-tools">
          <span id="questionCategory" class="badge">圣经人物</span>
          <button id="speakBtn" class="icon-btn">🔊 朗读题目</button>
        </div>
        <h2 id="questionText"></h2>
        <div id="answers" class="answers"></div>
      </article>

      <article id="explanationBox" class="explanation hidden" aria-live="polite">
        <h3 id="resultTitle"></h3>
        <p id="explanationText"></p>
        <p class="reference"><strong>经文出处：</strong><span id="referenceText"></span></p>
        <p id="reflectionText" class="reflection hidden"></p>
        <button id="nextBtn" class="primary-btn">下一题</button>
      </article>
    </section>

    <section id="resultScreen" class="screen">
      <article class="result-card">
        <p class="eyebrow">挑战完成</p>
        <h2 id="resultHeading">做得很好！</h2>
        <div class="score-ring"><span id="scoreValue">0%</span></div>
        <p id="scoreDetail"></p>
        <div id="resultMessage" class="encouragement"></div>
        <div class="result-actions">
          <button id="retryBtn" class="primary-btn">再挑战一次</button>
          <button id="resultHomeBtn" class="outline-btn">回到首页</button>
        </div>
      </article>
    </section>

    <section id="progressScreen" class="screen">
      <div class="quiz-head">
        <button id="progressBackBtn" class="text-btn">← 返回首页</button>
        <h2>我的学习进度</h2>
      </div>
      <div id="statsGrid" class="stats-grid"></div>
      <article class="progress-summary">
        <h3>学习建议</h3>
        <p id="progressAdvice"></p>
      </article>
    </section>
  </main>

  <footer>学习进度只保存在这台装置</footer>
  <script src="app.js"></script>
</body>
</html>
